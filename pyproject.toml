[project]
name = "payload-forge"
version = "0.1.0"
description = "Composable payload builder for red-team prompt-injection research: junk/noise generators, text encoders, and chassis assembly from YAML recipes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pf = "payload_forge.cli:app"
payload-forge = "payload_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payload_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
