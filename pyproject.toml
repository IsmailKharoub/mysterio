[project]
name = "mysterio"
version = "0.1.0"
description = "Composable payload builder for red-team prompt-injection research: junk/noise generators, text encoders, and chassis assembly from YAML recipes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "textual>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mysterio = "mysterio.cli:app"
mys = "mysterio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mysterio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
